<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ciccone Records — Countdown</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    overflow: hidden;
    color: #fff;
    font-family: Inter, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
    background:
      radial-gradient(circle at 20% 15%, rgba(255,255,255,.18), transparent 28%),
      radial-gradient(circle at 82% 80%, rgba(130,150,255,.14), transparent 30%),
      linear-gradient(135deg, #050505 0%, #111214 48%, #050505 100%);
  }

  body::before {
    content: "";
    position: fixed;
    inset: -20%;
    background:
      radial-gradient(circle at 50% 40%, rgba(255,255,255,.07), transparent 20%),
      radial-gradient(circle at 35% 70%, rgba(255,255,255,.05), transparent 25%);
    filter: blur(70px);
    pointer-events: none;
  }

  .page {
    width: min(1100px, 92vw);
    text-align: center;
    position: relative;
    z-index: 1;
  }

  .logo {
    width: min(430px, 72vw);
    height: auto;
    max-height: 170px;
    object-fit: contain;
    margin-bottom: 44px;
    filter: drop-shadow(0 12px 35px rgba(255,255,255,.08));
  }

  .glass {
    position: relative;
    padding: clamp(28px, 5vw, 58px);
    border: 1px solid rgba(255,255,255,.18);
    border-radius: 34px;
    background: linear-gradient(
      135deg,
      rgba(255,255,255,.14),
      rgba(255,255,255,.055) 45%,
      rgba(255,255,255,.025)
    );
    box-shadow:
      0 30px 90px rgba(0,0,0,.55),
      inset 0 1px 0 rgba(255,255,255,.22),
      inset 0 -1px 0 rgba(255,255,255,.05);
    backdrop-filter: blur(28px) saturate(140%);
    -webkit-backdrop-filter: blur(28px) saturate(140%);
  }

  .glass::before {
    content: "";
    position: absolute;
    inset: 1px;
    border-radius: 33px;
    pointer-events: none;
    background: linear-gradient(115deg, rgba(255,255,255,.16), transparent 28%, transparent 72%, rgba(255,255,255,.05));
  }

  .eyebrow {
    position: relative;
    margin: 0 0 12px;
    font-size: 11px;
    letter-spacing: .32em;
    text-transform: uppercase;
    opacity: .58;
  }

  h1 {
    position: relative;
    margin: 0 0 34px;
    font-size: clamp(32px, 5vw, 62px);
    line-height: .98;
    letter-spacing: -.055em;
    font-weight: 650;
  }

  .countdown {
    position: relative;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    max-width: 760px;
    margin: auto;
  }

  .unit {
    min-width: 0;
    padding: clamp(18px, 3vw, 30px) 10px;
    border-radius: 24px;
    background: rgba(255,255,255,.075);
    border: 1px solid rgba(255,255,255,.12);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.1);
  }

  .number {
    display: block;
    font-variant-numeric: tabular-nums;
    font-size: clamp(42px, 8vw, 82px);
    line-height: .9;
    font-weight: 600;
    letter-spacing: -.06em;
  }

  .label {
    display: block;
    margin-top: 13px;
    font-size: 10px;
    letter-spacing: .24em;
    text-transform: uppercase;
    opacity: .45;
  }

  .target {
    position: relative;
    margin: 26px 0 0;
    font-size: 13px;
    opacity: .52;
  }

  @media (max-width: 560px) {
    .logo { margin-bottom: 28px; }
    .glass { border-radius: 26px; }
    .unit { border-radius: 18px; }
  }
</style>
</head>

<script>
function updateCountdown() {
  const now = new Date();
  const target = new Date(now);
  target.setHours(17, 0, 0, 0);

  // Se 17:00 já passou, conta para as 17:00 do dia seguinte.
  if (now >= target) target.setDate(target.getDate() + 1);

  const diff = target - now;
  const totalSeconds = Math.max(0, Math.floor(diff / 1000));
  const h = Math.floor(totalSeconds / 3600);
  const m = Math.floor((totalSeconds % 3600) / 60);
  const s = totalSeconds % 60;

  document.getElementById("hours").textContent = String(h).padStart(2, "0");
  document.getElementById("minutes").textContent = String(m).padStart(2, "0");
  document.getElementById("seconds").textContent = String(s).padStart(2, "0");
}
updateCountdown();
setInterval(updateCountdown, 250);
</script>
