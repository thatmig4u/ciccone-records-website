<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">
<title>Ciccone Records — Em manutenção</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#050505;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
body::before{
  content:"";position:fixed;inset:-20%;
  background:
    radial-gradient(circle at 50% 45%,rgba(255,255,255,.075),transparent 24%),
    radial-gradient(circle at 10% 90%,rgba(255,255,255,.035),transparent 25%),
    radial-gradient(circle at 90% 10%,rgba(255,255,255,.025),transparent 25%);
  pointer-events:none;
}
.grid{
  position:fixed;inset:0;opacity:.035;pointer-events:none;
  background-image:linear-gradient(rgba(255,255,255,.5) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(255,255,255,.5) 1px,transparent 1px);
  background-size:80px 80px;
}
.wrap{
  width:min(900px,calc(100% - 36px));text-align:center;
  padding:55px 0;position:relative;z-index:1;
}
.logo{width:min(620px,88vw);height:auto;display:block;margin:0 auto 58px}
.tag{
  display:inline-flex;align-items:center;gap:9px;
  padding:9px 15px;border:1px solid rgba(255,255,255,.17);
  border-radius:999px;background:rgba(255,255,255,.055);
  color:#aaa;font-size:10px;font-weight:800;letter-spacing:1.7px;text-transform:uppercase;
}
.dot{width:6px;height:6px;background:#fff;border-radius:50%}
h1{
  margin:24px 0 15px;font-size:clamp(42px,8vw,82px);
  line-height:.9;letter-spacing:-5px;font-weight:900;
}
p{
  margin:0 auto;color:#888;max-width:570px;
  font-size:15px;line-height:1.7;
}
.contact{
  display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:35px;
}
.contact a{
  color:#fff;text-decoration:none;padding:13px 18px;
  border:1px solid rgba(255,255,255,.15);border-radius:999px;
  background:rgba(255,255,255,.065);font-size:12px;font-weight:700;
  transition:.2s ease;
}
.contact a:hover{background:#fff;color:#000;transform:translateY(-2px)}
.footer{
  margin-top:70px;color:#555;font-size:10px;letter-spacing:1.2px;
  text-transform:uppercase;
}
@media(max-width:600px){
  .wrap{padding:35px 0}
  .logo{margin-bottom:43px}
  h1{letter-spacing:-3px}
  p{font-size:13px}
  .footer{margin-top:52px}
}
</style>
</head>
